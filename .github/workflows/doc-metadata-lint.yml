name: Doc Metadata Lint

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/lint-doc-metadata.ps1"
      - "scripts/verify-repo-map-status.ps1"
      - "scripts/verify-last-reviewed-updated.ps1"
      - "scripts/update-last-reviewed-for-staged.ps1"
      - ".githooks/pre-commit"
      - ".github/workflows/doc-metadata-lint.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/lint-doc-metadata.ps1"
      - "scripts/verify-repo-map-status.ps1"
      - "scripts/verify-last-reviewed-updated.ps1"
      - "scripts/update-last-reviewed-for-staged.ps1"
      - ".githooks/pre-commit"
      - ".github/workflows/doc-metadata-lint.yml"

jobs:
  lint-doc-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint markdown metadata headers
        shell: pwsh
        run: ./scripts/lint-doc-metadata.ps1 -Root .

  verify-repo-map-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repo-map status matches docs
        shell: pwsh
        run: ./scripts/verify-repo-map-status.ps1 -Root . -RepoMapPath docs/indexes/repo-map.md

  verify-last-reviewed-updated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Last Reviewed was updated (pull request)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./scripts/verify-last-reviewed-updated.ps1 -BaseRef "${{ github.event.pull_request.base.sha }}" -HeadRef "${{ github.event.pull_request.head.sha }}"

      - name: Verify Last Reviewed was updated (push)
        if: github.event_name == 'push'
        shell: pwsh
        run: ./scripts/verify-last-reviewed-updated.ps1 -BaseRef "${{ github.event.before }}" -HeadRef "${{ github.sha }}"
